name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint policy contracts
        run: uv run ruff check tests/test_policy_contract.py

      - name: Run policy contracts
        run: uv run pytest
