[project]
name = "work-governance"
version = "1.4.1"
description = "Local Codex governance policy plugin backed by WorkVCS durable state"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
  "pyyaml>=6.0.3",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
